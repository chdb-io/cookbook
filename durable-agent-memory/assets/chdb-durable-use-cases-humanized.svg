<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Four real projects, four durable needs for embedded chDB</title>
  <desc id="desc">Four project categories where chDB durable is useful: ClickMem for agent memory, Maple for local observability, ReplayHouse for replay buffers, and vcfclick for expensive ingest.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .headline { font: 700 32px Arial, sans-serif; fill: #111111; }
      .sub { font: 400 17px Arial, sans-serif; fill: #333333; }
      .card { fill: #ffffff; stroke: #111111; stroke-width: 2.5; filter: url(#shadow); }
      .tagBox { fill: #ffcc01; stroke: #111111; stroke-width: 2; }
      .tag { font: 700 14px Arial, sans-serif; fill: #111111; }
      .name { font: 700 23px Arial, sans-serif; fill: #111111; }
      .body { font: 400 16px Arial, sans-serif; fill: #222222; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="660"/>
  <rect x="0" y="0" width="1200" height="16" fill="#ffcc01"/>
  <text x="70" y="72" class="headline">Four real projects, four durable needs</text>
  <text x="70" y="106" class="sub">Local analytical state is valuable, queryable, and should survive the host.</text>

  <rect x="70" y="155" width="500" height="205" rx="10" class="card"/>
  <rect x="104" y="190" width="128" height="28" rx="4" class="tagBox"/>
  <text x="126" y="209" class="tag">Agent memory</text>
  <text x="104" y="252" class="name">ClickMem</text>
  <text x="104" y="286" class="body">Beliefs, revisions, recall traces,</text>
  <text x="104" y="312" class="body">conflicts, and audit history</text>
  <text x="104" y="338" class="body">belong in one queryable store.</text>

  <rect x="630" y="155" width="500" height="205" rx="10" class="card"/>
  <rect x="664" y="190" width="146" height="28" rx="4" class="tagBox"/>
  <text x="686" y="209" class="tag">Observability</text>
  <text x="664" y="252" class="name">Maple Local</text>
  <text x="664" y="286" class="body">Traces, logs, and metrics collected</text>
  <text x="664" y="312" class="body">locally should recover after crashes</text>
  <text x="664" y="338" class="body">and CI teardown.</text>

  <rect x="70" y="390" width="500" height="205" rx="10" class="card"/>
  <rect x="104" y="420" width="152" height="28" rx="4" class="tagBox"/>
  <text x="126" y="439" class="tag">Replay buffers</text>
  <text x="104" y="482" class="name">ReplayHouse</text>
  <text x="104" y="520" class="body">Agent trajectories, scored rollouts,</text>
  <text x="104" y="546" class="body">priorities, and sampled batches</text>
  <text x="104" y="572" class="body">become recoverable state.</text>

  <rect x="630" y="390" width="500" height="205" rx="10" class="card"/>
  <rect x="664" y="420" width="150" height="28" rx="4" class="tagBox"/>
  <text x="686" y="439" class="tag">Expensive ingest</text>
  <text x="664" y="482" class="name">vcfclick</text>
  <text x="664" y="520" class="body">Prepared VCF/cohort data should</text>
  <text x="664" y="546" class="body">move without repeating large imports</text>
  <text x="664" y="572" class="body">on every machine.</text>
</svg>
